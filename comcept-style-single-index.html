</h1>\n<div class=\"hero-sub\"><p>從牙科臨床、專案管理到團隊領導，把專業課程重新整理成更清楚、更有節奏的學習體驗。</p><button aria-label=\"瀏覽課程\" class=\"round-arrow\" data-scroll=\"#courses\">↘</button></div>\n</div>\n<div class=\"hero-visual reveal\">\n<div class=\"shape a\"></div><div class=\"shape b\"></div><div class=\"shape c\"></div><div class=\"shape d\"></div>\n<div class=\"visual-photo\"><img alt=\"團隊學習與交流\" src=\"https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&amp;fit=crop&amp;w=1200&amp;q=86\"/></div>\n<div class=\"visual-label\">精選學習企劃 / 2026</div><div class=\"visual-index\">COMCEPT — 風格 02</div>\n</div>\n</div>\n</section>\n<div class=\"ticker\"><div class=\"ticker-track\"><span>臨床專業 <b>✦</b> 經營管理 <b>✦</b> 團隊領導 <b>✦</b> 實務學習 <b>✦</b> </span><span>臨床專業 <b>✦</b> 經營管理 <b>✦</b> 團隊領導 <b>✦</b> 實務學習 <b>✦</b> </span></div></div>\n<section class=\"section shell\" id=\"courses\">\n<div class=\"section-top reveal\"><div><div class=\"section-no\">01 / 精選課程</div><h2>選一堂課，<br/>成為你的下一步。</h2></div><p>點開課程卡即可查看完整介紹、講師、課程圖片與報名資訊。課程價格與梯次仍以最新公告為準。</p></div>\n<div class=\"filters reveal\"><button class=\"filter active\" data-filter=\"all\">全部課程</button><button class=\"filter\" data-filter=\"clinical\">臨床專業</button><button class=\"filter\" data-filter=\"management\">經營管理</button><button class=\"filter\" data-filter=\"leadership\">團隊領導</button></div>\n<div class=\"courses\" id=\"courseGrid\"></div>\n<div class=\"color-rail reveal\"><div class=\"rail mint\"><h3>把專業知識，重新整理成真正能行動的方法。</h3><small>COMCEPT / 換一種方式學習</small><i class=\"rail-shape\"></i></div><div class=\"rail blush\"><h3>理解。</h3><small>建立能力</small><i class=\"rail-shape\"></i></div><div class=\"rail yellow\"><h3>實踐。</h3><small>創造影響</small><i class=\"rail-shape\"></i></div></div>\n</section>\n<section class=\"section about\" id=\"about\"><div class=\"shell\"><div class=\"section-top reveal\"><div><div class=\"section-no\">02 / 為什麼選擇 COMCEPT</div><h2>少一點雜訊，<br/>多一點真正的進步。</h2></div><p>把複雜專業內容拆成可理解、可討論、可帶回現場執行的學習模組。</p></div><div class=  href=\"#method\">查看學習設計</a></div><div class=\"hero-metrics\"><div class=\"metric\"><strong>3</strong><span>學習主軸</span></div><div class=\"metric\"><strong>6+</strong><span>精選課程</span></div><div class=\"metric\"><strong>1→∞</strong><span>實務延伸</span></div></div></div>\n<div class=\"hero-board reveal\"><div class=\"tape\"></div><div class=\"spiral\"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class=\"notebook\"><div class=\"note-content\"><div class=\"note-top\"><span class=\"mono tiny\">FIELD NOTE 08 / DENTAL</span><span class=\"stamp\">DO THE REAL WORK</span></div><h3>今日學習觀察</h3><p>技術不是一張證書，而是能反覆驗證、持續優化的工作流程。</p><div class=\"mini-dashboard\"><div class=\"dash-card\"><span class=\"tiny mono\">PRACTICE</span><strong>76%</strong><div class=\"progress\"><i></i></div></div><div class=\"dash-card\"><span class=\"tiny mono\">SYSTEM</span><strong>LIVE</strong><div class=\"progress\"><i style=\"width:88%;background:linear-gradient(90deg,var(--blue),var(--violet))\"></i></div></div></div></div></div><div class=\"flower f1\"><span></span><span></span><span></span><span></span><span></span></div><div class=\"flower f2\"><span></span><span></span><span></span><span></span><span></span></div><div class=\"tech-chip chip1\">FLOW_STATUS: READY</div><div class=\"tech-chip chip2\">MODULE_01 / ACTIVE</div></div>\n</section>\n<div class=\"marquee\"><div class=\"marquee-track\"><span>CLINICAL SKILL ✦ MANAGEMENT SYSTEM ✦ TEAM LEADERSHIP ✦ HANDS-ON PRACTICE ✦</span><span>CLINICAL SKILL ✦ MANAGEMENT SYSTEM ✦ TEAM LEADERSHIP ✦ HANDS-ON PRACTICE ✦</span></div></div>\n<section id=\"courses\"><div class=\"wrap\"><div class=\"section-head reveal\"><div><div class=\"kicker\">COURSE MATRIX / 01</div><h2>選一條真正<br/>能落地的路徑</h2></div><p>課程內容依公開課程資料重新整理。點擊卡片查看詳細模組，並在視窗內送出報名資料。</p></div><div class=\"filters reveal\"><button class=\"filter active\" data-filter=\"all\">全部課程</button><button class=\"filter\" data-filter=\"clinical\">牙科專業</button><button class=\"filter\" data-filter=\"management\">診所經營</button><button class=\"filter\" data-filter=\"leadership\">人才培訓</button></div><div class=\"course-grid\" id=\"courseGrid\"></div></div></section>\n<section id=\"method\"><div class=\"wrap\"><div class=\"lab-band reveal\"><div class=\"lab-grid\"><div><div class=\"kicker\" style=\"color:var(--lime)\">LEARNING PROTOCOL / 02</div><h2>不是聽完，<br/>是做得出來。</h2><p>用案例、流程與實作，把知識從課堂搬回診間與團隊現場。</p></div><div class=\"steps\"><div class=\"step\"><b>01</b><div><h4>建立完整地圖</h4><p>先理解判斷框架，再拆解每個關鍵步驟。</p></div></div><div class=\"step\"><b>02</b><div><h4>案例與實作驗證</h4><p>將觀念放進真實情境，從操作中找到盲點。</p></div></div><div class=\"step\"><b>03</b><div><h4>形成可複製系統</h4><p>整理成 SOP、溝通語言與可追蹤的行動計畫。</p></div></div></div></div></div></div></section>\n<section id=\"about\"><div class=\"wrap\"><div class=\"section-head reveal\"><div><div class=\"kicker\">ABOUT / 03</div><h2>專業，是一起<br/>走得更遠。</h2></div><p>網站為一頁式課程展示範例。實際開課日期、名額、費用與報名規則，仍以主辦單位最新公告為準。</p></div></div></section>\n</main>\n<footer><div class=\"wrap footerbox\"><span>© 2026 Comcept — DEMO LANDING PAGE</span><span class=\"mono\">DESIGNED WITH NOTES, FLOWERS &amp; SYSTEMS.</span></div></footer>\n<div aria-hidden=\"true\" class=\"modal\" id=\"modal\"><div class=\"modal-card product-modal\"><div class=\"modal-head\"><div><span class=\"mono tiny\">COMCEPT / COURSE DETAIL</span><strong class=\"modal-head-title\">課程完整資訊</strong></div><button aria-label=\"關閉\" class=\"close\" id=\"close\">×</button></div><div class=\"product-top\"><div class=\"product-media\"><img alt=\"課程封面\" class=\"modal-cover\" id=\"mCover\"/><div class=\"modal-gallery\" id=\"mGallery\"></div></div><aside class=\"product-summary\"><div class=\"summary-stamp\">NOW OPEN</div><span class=\"tag\" id=\"mTag\"></span><h2 id=\"mTitle\"></h2><p id=\"mDesc\"></p><div class=\"summary-meta\" id=\"mMeta\"></div><div class=\"summary-price\"><span>課程費用</span><strong id=\"mPrice\"></strong><small>實際梯次與價格以最新公告為準</small></div><button class=\"summary-cta\" id=\"scrollToForm\" type=\"button\"> =\"btn ghost\" data-scroll=\"#about\">認識 Comcept</button></div></div><div class=\"hero-art\"><div class=\"blob one\"></div><div class=\"burst\">GO!</div><div class=\"smile\">☻</div><div class=\"hero-photo\"><img alt=\"課程現場\" src=\"https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&amp;fit=crop&amp;w=1200&amp;q=86\"/></div><div class=\"blob two\"></div><div class=\"scribble\">⌁⌁</div></div></div></div></div></section>\n<section class=\"stats\"><div class=\"wrap\"><div class=\"stats-grid reveal\"><article class=\"stat\"><span class=\"stat-icon\">□</span><strong>12+</strong><small>多元專業課程，從臨床到管理都能找到方向。</small></article><article class=\"stat\"><span class=\"stat-icon\">◎</span><strong>2,400+</strong><small>累積學習與交流人次，讓知識真的被帶回現場。</small></article><article class=\"stat\"><span class=\"stat-icon\">☆</span><strong>4.9</strong><small>以清楚、實用、好吸收的體驗為核心。</small></article></div></div></section>\n<section class=\"section\" id=\"courses\"><div class=\"wrap\"><div class=\"section-title-row reveal\"><h2>選一堂，<br/>現在最需要的課</h2><p>點開課程就能查看完整內容、講師、圖片與報名資訊。像選菜單一樣，先從你現在最想解決的問題開始。</p></div><div class=\"filters reveal\"><button class=\"filter active\" data-filter=\"all\">全部課程</button><button class=\"filter\" data-filter=\"clinical\">牙科專業</button><button class=\"filter\" data-filter=\"management\">診所經營</button><button class=\"filter\" data-filter=\"leadership\">人才培訓</button></div><div class=\"course-scroll\" id=\"courseGrid\"></div></div></section>\n<section class=\"about\" id=\"about\"><div class=\"wrap\"><div class=\"about-panel reveal\"><div class=\"about-grid\"><div class=\"about-copy\"><span class=\"mini\">Our Story</span><h2>不只是<br/>一堂課。</h2><div class=\"feature\"><b>從真實問題開始</b><p>先看工作現場真的卡在哪裡，再決定要學什麼。</p></div><div class=\"feature\"><b>把方法拆成可執行步驟</b><p>讓內容不只聽懂，回去之後也知道第一步怎麼做。</p></div><div class=\"feature\"><b>留一點空間給交流</b><p>案例、提問、討論，讓不同經驗真的碰在一起。</p></div></div><div class=\"about-photo\"><p class=\"about-note\">Comcept 想做的，是讓專業學習更有節奏、更有記憶點，也更容易進入狀態。</p><img alt=\"課堂交流\" src=\"https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&amp;fit=crop&amp;w=1200&amp;q=85\"/><span class=\"play\">▶</span></div></div></div></div></section>\n<section class=\"testimonials\"><div class=\"wrap\"><h2 class=\"center-title reveal\">學員怎麼說</h2><div class=\"people-grid reveal\"><article class=\"person\"><div class=\"person-photo\"><img alt=\"學員\" src=\"https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&amp;fit=crop&amp;w=400&amp;q=82\"/></div><div><div class=\"stars\">★★★★★</div><h3>怡君</h3><small>診所管理</small><p>內容不會只停在概念，很多工具隔天就可以拿回團隊使用。</p></div></article><article class=\"person\"><div class=\"person-photo\"><img alt=\"學員\" src=\"https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&amp;fit=crop&amp;w=400&amp;q=82\"/></div><div><div class=\"stars\">★★★★★</div><h3>雅雯</h3><small>牙科臨床</small><p>複雜內容拆得很清楚，案例也很貼近實際工作。</p></div></article><article class=\"person\"><div class=\"person-photo\"><img alt=\"學員\" src=\"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&amp;fit=crop&amp;w=400&amp;q=82\"/></div><div><div class=\"stars\">★★★★★</div><h3>柏勳</h3><small>團隊幹部</small><p>最有感的是討論方式，不會像傳統上課只是單向聽講。</p></div></article><article class=\"person\"><div class=\"person-photo\"><img alt=\"學員\" src=\"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&amp;fit=crop&amp;w=400&amp;q=82\"/></div><div><div class=\"stars\">★★★★★</div><h3>米亞</h3><small>診所營運</small><p>課後知道自己要改什麼，也更知道怎麼跟同事一起推進。</p></div></article></div></div></section>\n<section class=\"visit\" id=\"visit\"><div class=\"wrap\"><h2 class=\"reveal\">下一堂課，見。</h2><p class=\"visit-sub reveal\">每一梯次的日期、地點與名額，都會在課程詳細頁更新。</p><div class=\"visit-tags reveal\"><span>實體課程</span><span>小班互動</span><span>案例導向</span><span>梯次更新</span></div><div class=\"card-scene reveal\"><div class=\"route\"></div><article class=\"info-card one\"><img alt=\"教室\" src=\"https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&amp;fit=crop&amp;w=700&amp;q=82\"/><h4>舒適的學習空間</h4><p>讓討論、練習與交流都能自然發生。</p></article><article class=\"info-card two\"><h4>課程資訊</h4><p>日期、地點、價格與報名狀態，以各課程最新公告為準。</p></article><article class=\"info-card three\"><img alt=\"課程\" src=\"https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&amp;fit=crop&amp;w=700&amp;q=82\"/><h4>不只聽課</h4><p>案例拆解、討論與操作，讓學習有輸出。</p></article><article class=\"info-card four\"><h4>課堂紀錄</h4><img alt=\"課程紀錄\" src=\"https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&amp;fit=crop&amp;w=700&amp;q=82\"/></article></div></div></section>\n<section class=\"footer-cta\"><div class=\"wrap\"><h2>今天想學什麼？</h2><p>選一堂現在最有感的，從這裡開始。</p><div class=\"footer-actions\"><button class=\"btn white\" data-scroll=\"#courses\">開始選課</button><button class=\"btn\" data-scroll=\"#about\" style=\"background:var(--orange);color:white\">了解我們</button></div></div></section>\n</main>\n<footer class=\"footer-blue\"><div class=\"wrap\"><div class=\"footer-grid\"><div><h4>Comcept</h4><p>讓專業學習更好進入，也更容易帶回現場。</p></div><div><h4>探索</h4><div>牙科專業<br/>診所經營<br/>人才培訓</div></div><div><h4>資訊</h4><div>課程介紹<br/>講師陣容<br/>報名須知</div></div><div><h4>這是風格提案頁</h4><p>課程名稱、梯次、價格與報名資訊，正式上線時請以最新公告為準。</p></div></div><div class=\"footer-bottom\"><span>© 2026 Comcept</span><span>Instagram · Facebook · LINE</span></div><div class=\"footer-word\">每天，都學一點新的</div></div></footer>\n<div aria-hidden=\"true\" class=\"modal\" id=\"modal\"><div class=\"modal-card\"><button aria-label=\"關閉\" class=\"modal-close\" id=\"close\">×</button><div class=\"modal-top\"><div class=\"modal-cover\"><img alt=\"課程封面\" id=\"mCover\"/></div><div class=\"modal-summary\"><div class=\"modal-tag\" id=\"mTag\"></div><h2 id=\"mTitle\"></h2><p id=\"mDesc\"></p><div class=\"info-grid\"><div class=\"info-box\"><small>講師</small><b id=\"mInfoInstructor\"></b></div><div class=\"info-box\"><small>梯次 / 時間</small><b id=\"mInfoTime\"></b></div><div class=\"info-box\"><small>課程</small><b id=\"mInfoTitle\"></b></div><div <script>
(function(){
  const pages=JSON.parse(document.getElementById('embedded-pages').textContent);
  const cleanups=[];

  function mount(n){
    const host=document.getElementById('host'+n);
    const root=host.attachShadow({mode:'open'});
    const page=pages['style'+n];
    const style=document.createElement('style');
    style.textContent=page.css;
    root.appendChild(style);
    const wrapper=document.createElement('div');
    wrapper.className='page-body';
    wrapper.innerHTML=page.body;
    root.appendChild(wrapper);

    // Make hash links and converted buttons work inside the isolated page.
    root.addEventListener('click',e=>{
      const scrollEl=e.target.closest('[data-scroll],a[href^="#"]');
      if(!scrollEl) return;
      const selector=scrollEl.dataset.scroll || scrollEl.getAttribute('href');
      if(!selector || selector==='#') return;
      const target=root.querySelector(selector);
      if(target){ e.preventDefault(); target.scrollIntoView({behavior:'smooth'}); }
    });

    const docProxy=new Proxy(document,{
      get(target,prop){
        if(prop==='getElementById') return id=>root.getElementById(id);
        if(prop==='querySelector') return sel=>root.querySelector(sel);
        if(prop==='querySelectorAll') return sel=>root.querySelectorAll(sel);
        if(prop==='body') return wrapper;
        if(prop==='addEventListener') return target.addEventListener.bind(target);
        if(prop==='removeEventListener') return target.removeEventListener.bind(target);
        const value=target[prop];
        return typeof value==='function' ? value.bind(target) : value;
      }
    });
    const scope=new Proxy(window,{
      has(){return true},
      get(target,prop){
        if(prop===Symbol.unscopables) return undefined;
        if(prop==='document') return docProxy;
        if(prop==='window') return target;
        if(typeof prop==='string'){
          const byId=root.getElementById(prop);
          if(byId) return byId;
        }
        const value=target[prop];
        return typeof value==='function' ? value.bind(target) : value;
      }
    });
    try{
      new Function('scope', 'with(scope){\n'+page.script+'\n}')(scope);
    }catch(err){
      console.error('Style '+n+' script error:',err);
    }
  }

  [1,2,3].forEach(mount);
  function setStyle(n){
    [1,2,3].forEach(i=>document.getElementById('host'+i).classList.toggle('active',i===n));
    document.querySelectorAll('#style-switcher button').forEach(b=>b.classList.toggle('active',Number(b.dataset.style)===n));
    history.replaceState(null,'','#'+n);
    window.scrollTo({top:0,behavior:'instant'});
  }
  document.querySelectorAll('#style-switcher button').forEach(btn=>btn.addEventListener('click',()=>setStyle(Number(btn.dataset.style))));
  const initial=/^#[123]$/.test(location.hash)?Number(location.hash.slice(1)):1;
  setStyle(initial);
})();
</script>
